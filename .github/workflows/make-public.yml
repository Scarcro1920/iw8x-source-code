
name: Automatic Repository Public

on:
  schedule:
    - cron: "0 5 1 12 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-public:
    runs-on: ubuntu-latest

    steps:
      - name: Check date
        id: date
        run: |
          if [ "$(date -u +%Y-%m-%d)" = "2026-12-01" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for December 1, 2026."
          fi

      - name: Make repository public
        if: steps.date.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PATCH \
            "repos/$REPO" \
            -f visibility=public

          echo "Repository is now PUBLIC!"
