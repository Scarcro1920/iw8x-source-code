
name: Extract IW8x Client ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir temp
          unzip -o IW8x-client-main.zip -d temp

          # Remove the main folder if present
          if [ -d "temp/IW8x-client-main" ]; then
            cp -a temp/IW8x-client-main/. .
          else
            cp -a temp/. .
          fi

          rm -rf temp
          rm -f IW8x-client-main.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract IW8x client into repository"
          git push
