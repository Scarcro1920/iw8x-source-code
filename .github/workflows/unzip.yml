
name: Extract ZIP into Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP at repository root
        run: |
          mkdir -p temp
          unzip -o projet.zip -d temp

          # Move ZIP contents to repository root
          cp -a temp/. .

          rm -rf temp
          rm -f IW8x-client-main.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract ZIP into repository"
          git push
